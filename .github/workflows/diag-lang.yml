# GEÇİCİ tanı iş akışı: dil düğmesi takılması. İş bitince silinecek.
name: Dil gecisi tani (gecici)
on:
  push:
    branches: [dev_source]
    paths: ['.github/workflows/diag-lang.yml', '.github/diag/**']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bot kontrolü (curl, Chrome kimliğiyle)
        continue-on-error: true
        run: |
          set +e
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36'
          for h in muratvural.com dev.muratvural.com; do for sp in none prefetch 'prefetch;prerender'; do
            H=(); [ "$sp" != none ] && H=(-H "Sec-Purpose: $sp")
            curl -s -o /tmp/b -A "$UA" -H 'Accept: text/html' "${H[@]}" -w "$h /en/ sp=$sp code=%{http_code} total=%{time_total}s size=%{size_download}" https://$h/en/; echo " title: $(grep -o '<title>[^<]*' /tmp/b | head -1)"
          done; done
      - name: Playwright ile düğme
        continue-on-error: true
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null 2>&1
          cp $GITHUB_WORKSPACE/.github/diag/pw.cjs .
          for H in dev.muratvural.com muratvural.com; do node pw.cjs $H 8000; node pw.cjs $H 2500; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: diag, path: /tmp/shot-*.png }
