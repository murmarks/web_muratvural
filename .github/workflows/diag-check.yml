# GEÇİCİ: canlı site kontrolü. İş bitince silinecek.
name: Canli kontrol (gecici)
on:
  push:
    branches: [dev_source]
    paths: ['.github/workflows/diag-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://muratvural.com
          for i in $(seq 1 60); do curl -s "$U/tr/?t=$i" | grep -q 'mv-bekle' && { echo "canlı yeni sürümde ($i)"; break; }; sleep 10; done
          for u in / /tr/ /en/ /en/services/ /tr/about/ /ayar.php /robots.txt; do curl -s -o /dev/null -w "$u %{http_code}\n" "$U$u"; done
          echo "robots:"; curl -s "$U/robots.txt"; echo
          echo "html başlıkları:"; curl -sI "$U/tr/" | grep -i -E "x-robots|cache-control" || echo "(noindex yok)"
          echo "ayar.php:"; curl -s "$U/ayar.php?t=1"; echo
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null 2>&1
          cat > c.cjs <<'JS'
          const { chromium } = require('playwright');
          const U = 'https://muratvural.com';
          (async () => {
            const b = await chromium.launch({ channel: 'chrome' }); const errs = [];
            for (const [loc, tz] of [['en-US', 'Asia/Ho_Chi_Minh'], ['tr-TR', 'Asia/Ho_Chi_Minh'], ['en-US', 'Europe/Istanbul']]) {
              const c = await b.newContext({ viewport: { width: 1536, height: 864 }, locale: loc, timezoneId: tz });
              const q = await c.newPage(); q.on('pageerror', (e) => errs.push(e.message));
              await q.goto(U + '/', { waitUntil: 'commit' }); await q.waitForURL(/\/(tr|en)\//, { timeout: 40000 }).catch(() => {}); await q.waitForTimeout(3000);
              console.log(loc, tz, '→', new URL(q.url()).pathname, await q.evaluate(() => [document.documentElement.dataset.theme, document.documentElement.hasAttribute('data-backdrop'), !!document.querySelector('canvas.backdrop'), document.querySelector('link[rel=canonical]')?.href]));
              await c.close();
            }
            const c = await b.newContext({ viewport: { width: 1536, height: 864 } });
            const p = await c.newPage(); p.on('pageerror', (e) => errs.push('panel ' + e.message));
            await p.goto(U + '/tr/?ayar', { waitUntil: 'commit' });
            await p.waitForSelector('.ap-kilit', { timeout: 40000 }).then(() => console.log('panel kilitli açıldı'), () => console.log('PANEL YOK'));
            await p.fill('.ap-kilit input', 'yanlis'); await p.click('.ap-kilit button'); await p.waitForTimeout(2500);
            console.log('yanlış şifre:', await p.textContent('.ap-not'));
            console.log('şifresiz ayar alanı sayısı (0 olmalı):', await p.$$eval('.ap input[type=range]', (x) => x.length));
            console.log('hatalar', JSON.stringify(errs)); await b.close();
          })();
          JS
          node c.cjs
