# GEÇİCİ: dev sitesi kontrolü. İş bitince silinecek.
name: Dev kontrol (gecici)
on:
  push:
    branches: [dev_source]
    paths: ['.github/workflows/diag-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://dev.muratvural.com
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null 2>&1
          cat > c.cjs <<'JS'
          const { chromium } = require('playwright');
          const U = 'https://dev.muratvural.com';
          (async () => {
            const b = await chromium.launch({ channel: 'chrome' });
            const c = await b.newContext({ viewport: { width: 1536, height: 864 } });
            const p = await c.newPage(); const errs = []; let dialogs = 0;
            p.on('pageerror', (e) => errs.push(e.message)); p.on('dialog', (d) => { dialogs++; d.dismiss(); });
            for (let i = 0; i < 40; i++) {
              await p.goto(U + '/tr/?ayar&v=' + i, { waitUntil: 'commit' });
              const ok = await p.waitForSelector('.ap-kilit', { timeout: 30000 }).then(() => true, () => false);
              const yeni = ok && (await p.evaluate(() => [...document.scripts].some((s) => s.textContent.includes('mv-taslak'))));
              if (yeni) { console.log('yeni sürüm', i); break; }
              await p.waitForTimeout(10000);
            }
            await p.fill('.ap-kilit input', 'murvur'); await p.click('.ap-kilit button'); await p.waitForSelector('.ap-govde', { timeout: 15000 });
            console.log('kayma ipucu:', await p.textContent('.ap-k small'));
            await p.click('.ap-sec button[data-v=acik]');
            await p.click('a[href="/tr/services/"]').catch(async () => p.goto(U + '/tr/services/'));
            await p.waitForURL(/services/, { timeout: 30000 }); await p.waitForSelector('.ap-govde', { timeout: 20000 }).catch(() => {});
            console.log('hizmetler sayfası:', await p.evaluate(() => [document.documentElement.dataset.theme, !!document.querySelector('.ap-govde')]), 'uyarı kutusu', dialogs);
            p.removeAllListeners('dialog'); p.on('dialog', (d) => d.accept());
            await p.click('.ap-alt [data-cik]'); await p.waitForTimeout(500);
            console.log('çıkış:', await p.evaluate(() => [document.documentElement.dataset.theme, !!document.querySelector('.ap')]));
            console.log('sunucu kaydı:', await p.evaluate(() => fetch('/ayar.php?t=' + Date.now()).then((r) => r.text())));
            console.log('hatalar', JSON.stringify(errs)); await b.close();
          })();
          JS
          node c.cjs
