# GEÇİCİ: dev sitesinde ayar paneli kontrolü. İş bitince silinecek.
name: Dev kontrol (gecici)
on:
  push:
    branches: [dev_source]
    paths: ['.github/workflows/diag-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://dev.muratvural.com
          for i in $(seq 1 40); do curl -s "$U/ayar.php?t=$i" | grep -q '^{' && { echo "GET {} ($i)"; break; }; sleep 10; done
          curl -s "$U/ayar.php?t=x"; echo
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null 2>&1
          cat > c.cjs <<'JS'
          const { chromium } = require('playwright');
          const U = 'https://dev.muratvural.com';
          (async () => {
            const b = await chromium.launch({ channel: 'chrome' }); const errs = [];
            for (const [loc, tz] of [['en-US', 'Asia/Ho_Chi_Minh'], ['tr-TR', 'Asia/Ho_Chi_Minh'], ['en-US', 'Europe/Istanbul']]) {
              const c = await b.newContext({ viewport: { width: 1536, height: 864 }, locale: loc, timezoneId: tz });
              const q = await c.newPage(); q.on('pageerror', (e) => errs.push(e.message));
              await q.goto(U + '/', { waitUntil: 'commit' }); await q.waitForURL(/\/(tr|en)\//, { timeout: 40000 }).catch(() => {}); await q.waitForTimeout(2500);
              console.log(loc, tz, '→', new URL(q.url()).pathname, await q.evaluate(() => [document.documentElement.dataset.theme, document.documentElement.className]));
              await c.close();
            }
            console.log('hatalar', JSON.stringify(errs)); await b.close();
          })();
          JS
          node c.cjs
