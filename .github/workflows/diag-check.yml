# GEÇİCİ: canlıya alma sonrası ziyaretçi gibi kontrol. İş bitince silinecek.
name: Canli kontrol (gecici)
on:
  push:
    branches: [dev_source]
    paths: ['.github/workflows/diag-check.yml', '.github/diag/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for i in $(seq 1 60); do curl -s https://muratvural.com/tr/ | grep -q 'https://muratvural.com/tr/' && { echo "canlı yeni sürümde ($i)"; break; }; sleep 10; done
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null 2>&1
          cp $GITHUB_WORKSPACE/.github/diag/check.cjs . && node check.cjs
